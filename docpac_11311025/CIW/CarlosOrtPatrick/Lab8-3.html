<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 3-2</title>
    </head>
	
	<body>
	  <div id="output"></div>
	  <h2>CIW JavaScript Specialist</h2>
	  <hr>

	  <script>
		//  write your code here
		function* integer() {
		let numb = 1;
		while (numb <= 5) {
			yield numb;
			numb++;
		}
	}
	   
		//  create generator object here
		const get = integer();

	  
		//  get reference to the HTML element where generator output will be displayed
		const output = document.getElementById('output');

		//  write the for loop here    
		for (const value of get) {
			output.innerHTML += value;
		}

	  </script>
	</body>
</html>
