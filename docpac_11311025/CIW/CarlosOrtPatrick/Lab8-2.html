<!DOCTYPE html>
<html lang="en">

        <meta charset="utf-8">
        <title>Lab 8-2</title>
    </head>
	
	<body>
	  <h2>CIW JavaScript Specialist</h2>
	  <hr>

		<script>
		// create a class here
		class Device {
		  constructor(name, brand) {
			this.name = name;
			this.brand = brand;
		  }

		  display() {
			document.write("Name: " + this.name + " Brand: " + this.brand);
		  }
		}


		const dev1 = new Device("Vostro", "Dell");
		dev1.display();
		</script>

	</body>
</html>
