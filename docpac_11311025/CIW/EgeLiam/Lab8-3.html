<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Lab 8-3</title>
</head>

<body>
	<div id="output"></div>
	<h2>CIW JavaScript Specialist</h2>
	<hr>

	<script>
		function* integer() {
			let num = 1;
			while (true) {
				yield num++;
			}
		}

		const get = integer();

		for (let i = 0; i < 5; i++) {
			const span = document.createElement("span");
			span.textContent = get.next().value + " ";
			output.appendChild(span);
		}


	</script>
</body>

</html>
