<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 8-2</title>
    </head>
	
	<body>
	  <h2>CIW JavaScript Specialist</h2>
	  <hr>

		<script>
		// create a class here
			class device {
				constructor (name, brand) {
					this.name = name;
					this.brand = brand;
				}
				display() {
					document.write(`Device Name: ${this.name} <br> Brand: ${this.brand}`);
				}
			}

		const dev1 = new device("Vostro", "Dell");
		dev1.display();
		</script>

	</body>
</html>
