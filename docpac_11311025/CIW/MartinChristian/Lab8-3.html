<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Lab 3-2</title>
</head>

<body>
	<div id="output"></div>
	<h2>CIW JavaScript Specialist</h2>
	<hr>

	<script>
		function* integer() {
			let num = 1;
			while (true) {
				yield num++;
			}
		}

		const gen = integer();

		const output = document.getElementById('output');

		for (i = 0; i < 5; i++) {
			const span = document.createElement('span');
			span.textContent = gen.next().value + ' ';
			output.appendChild(span);
		}

	</script>
</body>

</html>
