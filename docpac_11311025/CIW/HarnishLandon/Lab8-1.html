<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Lab 8-1</title>
	<style>
		body {
			font-family: Arial, sans-serif;
		}
	</style>
</head>

<body>
	<h2>CIW JavaScript Specialist</h2>
	<h3>Employee Database</h3>
	<hr>
	<form id="empForm">
		<strong>Select name to view information:</strong>
		<select id="empSelect" name="empName">
			<!-- Options will be added dynamically -->
		</select>
		<p>
			<button type="button" id="showAllBtn">Show All Employees</button>
		</p>
	</form>

	<script>
		
		class Employee {
			
			
			
			
			constructor(name, department, extension) {
				this.name = name;
				this.department = department;
				this.extension = extension;
			}

			
			
			showInfo() {
				alert(`Name: ${this.name}\nDepartment: ${this.department}\nExtension: ${this.extension}`);
			}
		}

		
		
		
		const employees = [
			null,
			new Employee('Alice Johnson', 'Marketing', '101'),
			new Employee('Bob Smith', 'Sales', '102'),
			new Employee('Charlie Davis', 'IT', '103')
		];

		const empSelect = document.getElementById('empSelect');
		const showAllBtn = document.getElementById('showAllBtn');

		
		function populateEmployeeOptions() {
			empSelect.innerHTML = '';

			const defaultOption = document.createElement('option');
			defaultOption.textContent = 'Select Employee';
			defaultOption.value = '';
			empSelect.appendChild(defaultOption);

			
			
			for (let i = 1; i < employees.length; i++) {
				const option = document.createElement('option');
				option.textContent = employees[i].name;
				option.value = i;
				empSelect.appendChild(option);
			}
		}

		
		
		empSelect.addEventListener('change', () => {
			const selectedIndex = empSelect.value;
			if (selectedIndex) {
				employees[selectedIndex].showInfo();
			}
		});

		
		
		
		showAllBtn.addEventListener('click', () => {
			let allInfo = '';
			for (let i = 1; i < employees.length; i++) {
				allInfo += `Name: ${employees[i].name}\nDepartment: ${employees[i].department}\nExtension: ${employees[i].extension}\n\n`;
			}
			alert(allInfo.trim());
		});

		
		populateEmployeeOptions();
	</script>

</body>

</html>
