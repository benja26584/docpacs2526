<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 8-2</title>
    </head>
	
	<body>
	  <h2>CIW JavaScript Specialist</h2>
	  <hr>

		<script>
		class Device {
			constructor(name, brand) {
				this.name = name;
				this.brand = brand;
			}

			display() {
				document.write(`The name of the device is ${this.name} and its brand is ${this.brand}`);
			}
		}


		const dev1 = new Device("Vostro", "Dell");
		dev1.display();
		</script>

	</body>
</html>
