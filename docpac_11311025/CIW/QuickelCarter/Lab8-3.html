	  <script>
		function* integer() {
			num = 1
			while (true) {
				yield num++;
			}
		}
	   
		const get = integer()
	  
		const output = document.getElementById("output")

		for (i = 0; i < 5; i++) {

			const next = get.next().value

			output.textContent += next + " ";
		}

	  </script>
