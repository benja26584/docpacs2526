<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Lab 7-9</title>
	</head>
	
	<body>
		<h2>CIW JavaScript Specialist</h2>
		<hr>
		<div id="quote-container">
		<script>
		const randomnumber=Math.floor(Math.random()*10);

		// Add function and quotes in Step 4
		document.addEventListener('DOMContentLoaded', () => {
      const quotes = [
      { text: "Every time history repeats itself, the price goes up.", author: "Anonymous" },
        { text: "The moment you think you understand a great work of art, it's dead for you.", author: "Robert Wilson" },
        { text: "To love one person with a private love is poor and miserable; to love all is glorious.", author: "Thomas Traherne" },
        { text: "Every violation of truth is not only a sort of suicide in the liar, but is a stab at the health of human society.", author: "Ralph Waldo Emerson" },
        { text: "Man is to be found in reason, God in the passions.", author: "G. C. Lichtenberg" },
        { text: "Great innovations should not be forced on slender majorities.", author: "Thomas Jefferson" },
        { text: "In this world nothing can be said to be certain, except death and taxes.", author: "Benjamin Franklin" },
        { text: "Nine-tenths of wisdom consists in being wise in time.", author: "Theodore Roosevelt" },
        { text: "We have no more right to consume happiness without producing it than to consume wealth without producing it.", author: "George Bernard Shaw" },
        { text: "So little done, so much to do.", author: "Cecil Rhodes" }
      ];

      // Use a hard-coded 10 for random number generation
      const randomnumber = Math.floor(Math.random() * 10);

      const quoteContainer = document.getElementById('quote-container');

      const quoteText = document.createElement('p');
	  console.log(quoteText);
      quoteText.textContent = quotes[randomnumber].text;
	  console.log(quoteText.textContent);

      const authorText = document.createElement('small');
	  console.log(authorText);
      const authorEm = document.createElement('em');
	  console.log(authorEm);
      authorEm.textContent = `- ${quotes[randomnumber].author}`;
	  console.log(authorEm.textContent);
      authorText.appendChild(authorEm);

      quoteContainer.appendChild(quoteText);
      quoteContainer.appendChild(authorText);
    });

		</script>
	</body>
</html>
