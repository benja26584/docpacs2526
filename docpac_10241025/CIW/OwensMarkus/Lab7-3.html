<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 7-3</title>

		<script>
		document.addEventListener("DOMContentLoaded", () => {
		  const str = "Mark, Pete, Emily, Adam";
		  // storing an array of values in split variable
		 const unoresult = str.split(", ");
		 console.log(unoresult);


		  // replacing a value in the string
		  const thingy= /Pete/;
		  const dosresult = str.replace(thingy, "Betsy");
		  console.log(dosresult);


		  // searching the position of a string in another
		 tresresult = str.search("Emily");
		  console.log(tresresult);

		});
		</script>
	</head>

	<body>
	  <h2>CIW JavaScript Specialist</h2>
	  <hr>
	</body>
</html>
