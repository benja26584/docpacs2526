<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 7-3</title>

		<script>
		document.addEventListener("DOMContentLoaded", () => {
		  const str = "Mark, Pete, Emily, Adam";
		  // storing an array of values in split variable
			console.log(str.split(", "))


		  // replacing a value in the string
			console.log(str.replace("Pete", "Betsy"))

		  // searching the position of a string in another
			console.log(str.search("Emily"))

		});
		</script>
	</head>

	<body>
	  <h2>CIW JavaScript Specialist</h2>
	  <hr>
	</body>
</html>
