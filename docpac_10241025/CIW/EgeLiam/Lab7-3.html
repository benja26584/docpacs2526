<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Lab 7-3</title>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			const str = "Mark, Pete, Emily, Adam";
			// storing an array of values in split variable
			const split = str.split(", ");


			// replacing a value in the string
			const replaced = str.replace("Pete", "Betsy");

			// searching the position of a string in another
			const position = str.indexOf("Emily");
			alert("Original String: " + str +
				"\n\nSplit into Array: " + split.join(" | ") +
				"\n\nReplaced String: " + replaced +
				"\n\nPosition of 'Emily': " + position);
		});
	</script>
</head>

<body>
	<h2>CIW JavaScript Specialist</h2>
	<hr>
</body>

</html>
